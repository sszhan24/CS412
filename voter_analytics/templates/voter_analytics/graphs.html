  Sion Zhan (sszhan24@bu.edu), 10/27/26
  Displays aggregate graphs of filtered voter data -->

{% extends 'voter_analytics/base.html' %}

{% block content%}
<h1>Voter Analytic Graphs</h1>

<!-- filter form (copied from voter_list.html) -->
<form method="GET" action="{% url 'voter_analytics:graphs' %}">
    <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">

        <div>
            <label for="party">Party:</label><br>
            <select name="party" id="party">
                <option value="">All</option>
                <!-- if party has a trailing space in the database (e.g., 'U '), might need to use 'U ' here -->
                <option value="D" {% if current_filters.party == 'D' %}selected{% endif %}>D</option>
                <option value="R" {% if current_filters.party == 'R' %}selected{% endif %}>R</option>
                <option value="U" {% if current_filters.party == 'U' %}selected{% endif %}>U</option>
            </select>
        </div>
        <div>
            <label for="min_dob">Min Birth Year:</label><br>
            <select name="min_dob" id="min_dob">
                <option value="">Any</option>
                {% for year in birth_years %}
                    <option value="{{ year }}" {% if current_filters.min_dob == year|stringformat:"s" %}selected{% endif %}>{{ year }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="max_dob">Max Birth Year:</label><br>
            <select name="max_dob" id="max_dob">
                <option value="">Any</option>
                {% for year in birth_years %}
                    <option value="{{ year }}" {% if current_filters.max_dob == year|stringformat:"s" %}selected{% endif %}>{{  year }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="score">Voter Score:</label><br>
            <select name="score" id="score">
                <option value="">Any</option>
                {% for s in scores %}
                    <option value="{{ s }}" {% if current_filters.score == s|stringformat:"s" %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div style="margin-bottom: 1rem;">
        <strong>Voted In:</strong><br>
        <label><input type="checkbox" name="v20state" {% if current_filters.v20state %}checked{% endif %}> 2020 State</label>
        <label><input type="checkbox" name="v21town" {% if current_filters.v21town %}checked{% endif %}> 2021 Town</label>
        <label><input type="checkbox" name="v21primary" {% if current_filters.v21primary %}checked{% endif %}> 2021 Primary</label>
        <label><input type="checkbox" name="v22general" {% if current_filters.v22general %}checked{% endif %}> 2022 General</label>
        <label><input type="checkbox" name="v23town" {% if current_filters.v23town %}checked{% endif %}>2023 Town</label>
    </div>

    <button type="submit">Apply Filters</button>
    <a href="{% url 'voter_analytics:graphs' %}">Clear Filters</a>
</form>

<hr>

<!-- graphs section -->
{% if n == 0 %}
    <p>No voters found matching your criteria</p>
{% else %}
    <div style="margin-bottom: 3rem;">
        {{ graph1|safe }}
    </div>
    <div style="margin-bottom: 3rem;">
        {{ graph2|safe }}
    </div>
    <div style="margin-bottom: 3rem;">
        {{ graph3|safe }}
    </div>
{% endif %}

{% endblock %}
