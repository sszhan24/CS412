    Sion Zhan (szhan24@bu.edu), 11/10/26
    Displays a list of all jokes with no images
-->

{% extends 'dadjokes/base.html' %}
{% block content %}
<h1>All Jokes</h1>
<ul>
    {% for joke in jokes %}
        <li>
            <a href="{% url 'dadjokes:joke_detail' joke.pk %}">{{ joke.text }}</a>
            - {{ joke.contributor }}
        </li>
    {% empty %}
        <li>No jokes yet.</li>
    {% endfor %}
</ul>
{% endblock %}
