{% extends 'dadjokes/base.html' %}
{% block content %}
<h1>All Pictures</h1>
{% for picture in pictures %}
    <div class="picture-box">
        <a href="{% url 'dadjokes:picture_detail' picture.pk %}">
            <img src="{{ picture.image_url }}" alt="Picture">
        </a>
        <p><small>- {{ picture.contributor }}</small></p>
    </div>
{% empty %}
    <p>No pictures yet.</p>
{% endfor %}
{% endblock %}
