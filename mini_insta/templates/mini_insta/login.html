    login page using Django's built in LoginView form -->

{% extends 'mini_insta/base.html' %}
{% block content %}
<h1>Login</h1>

<form method="post" action="{% url 'mini_insta:login' %}">
    {% csrf_token %}

    {{ form.as_p }}

    <!-- the 'next' field tell Django where to go after a successful login -->
    {% if request.GET.next %}
        <!-- if the user was redirected here from a protected page, send them back there -->
         <input type="hidden" name="next" value="{{ request.GET.next }}">

    {% else %}
        <!-- If they just clicked Login from the nav, send them to main profiles page -->
        <input type="hidden" name="next" value="{% url 'mini_insta:show_all_profiles' %}">
    {% endif %}

    <button type="submit">Login</button>

</form>

<p>Don't have an account? <a href="{% url 'mini_insta:create_profile' %}"">Create one here</a></p>
{% endblock %}
