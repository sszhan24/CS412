{% extends 'mini_insta/base.html' %}
{% block content %}
<h1>Search</h1>
<p><em>@{{ profile.username }}</em></p>

<form method="GET" action="{% url 'mini_insta:search' %}">
    <p>
        <label for="query">Search for text, tags, or people:</label><br>
        <textarea name="query" id="query" rows="4" cols="40"></textarea>
    </p>
    <button type="submit">Search</button>
</form>

<p><a href="{% url 'mini_insta:show_profile' profile.pk%}">Back to profile</a></p>
{% endblock %}
