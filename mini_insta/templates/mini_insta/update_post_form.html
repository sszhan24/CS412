    Form for updating a post's caption -->

{% extends 'mini_insta/base.html' %}
{% block content %}
<h1>Update Post</h1>
<p><em>by {{ post.profile.username }}</em></p>

<form method="POST" action="{% url 'mini_insta:update_post' post.pk %}">
    {% csrf_token %}

    {% for field in form %}
        <p>
            <label for="{{ field.id_for_label }}">{{ field.label }}:</label><br>
            {{ field }}
            {% if field.errors %}
                <br><span class="error">{{ field.errors }}</span>
            {% endif %}
        </p>
    {% endfor %}

    <button type="submit">Save Changes</button>
</form>

<form method="GET" action="{% url 'mini_insta:show_post' post.pk %}">
    <button type="submit">Cancel</button>
</form>
{% endblock %}
