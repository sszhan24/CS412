    list of profiles who follow a given profile
-->

{% extends 'mini_insta/base.html' %}
{% block content %}
<h1>Followers of {{ profile.username }}</h1>

<ul>
    {% for follower in profile.get_followers %}
        <li>
            <a href="{% url 'mini_insta:show_profile' follower.pk %}">
                {{ follower.username }}
            </a>
        </li>
    {% empty %}
        <li>No followers yet.</li>
    {% endfor %}
</ul>

<p><a href="{% url 'mini_insta:show_profile' profile.pk %}">Back to profile</a></p>
{% endblock %}
