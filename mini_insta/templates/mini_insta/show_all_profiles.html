{% extends 'mini_insta/base.html' %}
{% block content %}
<h1>All Profiles</h1>

<table>
    <thead>
        <tr>
            <th>Image</th>
            <th>Username</th>
            <th>Display Name</th>
        </tr>
    </thead>
    <tbody>
        {% for profile in profiles %}
        <tr>
            <td>
                {% if profile.profile_image_url %}
                <img src="{{ profile.profile_image_url }}" alt="{{ profile.username }}" width="80">
                {% endif %}
            </td>
            <td>
                <a href="{% url 'mini_insta:profile-detail' profile.pk %}">
                    {{ profile.username }}
                </a>
            </td>
            <td>{{ profile.display_name }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No profiles yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
