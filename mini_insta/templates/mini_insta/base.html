<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Mini Insta{% endblock %}</title>
    <style>
        body {font-family: sans-serif; max-width: 720px; margin: 2rem auto; }
        nav a { margin-right: 1rem; }
        .post { border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
        .post img { max-width: 100%; border-radius: 6px; }
        .profile-image { border-radius: 50%; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'mini_insta:show_all_profiles' %}">Profiles</a>
        {% if request.user.is_authenticated %}
            <!-- logged in user links -->
            <a href="{% url 'mini_insta:show_feed' %}">My Feed</a>
            <a href="{% url 'mini_insta:search' %}">Search</a>
            <a href="{% url 'mini_insta:create_post' %}">Create Post</a>
            <a href="{% url 'mini_insta:my_profile' %}">My Profile</a>

            <!-- logout must be a POST form in modern Django -->
            <form method="post" action="{% url 'mini_insta:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" style="background:none; border:none; color:inherit; text-decoration:underline; cursor:pointer;">
                    Logout ({{ request.user.username }})
                </button>
            </form>
        {% else %}
            <!-- logged out user links -->
            <a href="{% url 'mini_insta:login' %}">Login</a>
            <a href="{% url 'mini_insta:create_profile' %}">Create Profile</a>
        {% endif %}

        <a href="{% url 'admin:index' %}">Admin</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
    
    <hr>
    <footer>
        <a href="{% url 'mini_insta:show_all_profiles' %}">Back to all profiles</a>
        {% if request.user.is_authenticated %}
            | <a href="{% url 'mini_insta:create_post' %}">+ Create Post</a>
        {% endif %}
    </footer>
</body>
</html>
