    Confirmation page for deleting a post-->

{% extends 'mini_insta/base.html' %}
{% block content %}
<h1>Delete Post</h1>

<p>Are you sure you want to delete this post?</p>

<div class="post-preview">
    <p><strong>Author:</strong>{{ post.profile.username }}</p>
    <p><strong>Caption:</strong>{{ post.caption|default:"(no caption)" }}</p>
    <p><small>{{ post.timestamp|date:"M d, Y H:i" }}</small></p>
</div>

<!-- Confirm delete: POST back to the same url -->
<form method="POST" action="{% url 'mini_insta:delete_post' post.pk %}">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
</form>

<!-- Cancel: GET to the profile page -->
<form method="GET" action="{% url 'mini_insta:show_profile' profile.pk %}">
    <button type="submit">Cancel</button>
</form> 

{% endblock %}
